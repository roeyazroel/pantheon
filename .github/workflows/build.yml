# Builds and tests every push to main, and exports the game for Windows, macOS and Linux, each on
# its own system (ADR-075). The exports run when started by hand (Actions > Build > Run workflow)
# or by pushing a version tag (v*), which also publishes them as a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push or pull request update cancels the older one's tests; an export by hand or by a tag
# is never cancelled.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # An exact SDK, not 8.0.x: "the latest 8.0" resolves through aka.ms links, and on 2026-10-25 the
  # macOS one pointed at an unpublished 8.0.427 that could not be downloaded.
  DOTNET_SDK_VERSION: "8.0.426"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Fetch Terrain3D's libraries
        run: tools/vendor-terrain3d.sh

      - name: Build
        run: dotnet build Pantheon.sln

      - name: Test
        run: dotnet test Pantheon.sln --no-build

  export:
    name: Export (${{ matrix.platform }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            preset: Windows Desktop
            output: windows/Pantheon.exe
            package: Pantheon-windows-x86_64.zip
          # The macOS export signs the app with Apple's codesign, which only runs on a Mac.
          - platform: macos
            runner: macos-latest
            preset: macOS
            output: macos/Pantheon.zip
            package: Pantheon-macos-universal.zip
          - platform: linux
            runner: ubuntu-latest
            preset: Linux
            output: linux/Pantheon.x86_64
            package: Pantheon-linux-x86_64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Cache Godot
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ runner.os }}-${{ hashFiles('tools/install-godot.sh') }}

      - name: Install Godot and its export templates
        run: |
          godot="$(tools/install-godot.sh --dest "${RUNNER_TEMP}/godot")"
          echo "GODOT=${godot}" >> "${GITHUB_ENV}"

      - name: Fetch Terrain3D's libraries
        run: tools/vendor-terrain3d.sh

      # TEMPORARY: the Linux import crashed at exit (139) on the runner only. On a failure there,
      # trace-godot.sh runs the same command again under gdb, to show where it crashes.
      - name: Prepare a crash trace (Linux, temporary)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb > /dev/null
          # .NET signals its threads with SIGRTMIN and up; let them pass.
          printf '%s\n' 'set pagination off' 'handle SIGPIPE SIGUSR1 SIGUSR2 nostop noprint pass' \
            'handle SIG34 SIG35 SIG36 SIG37 nostop noprint pass' 'run' 'bt' > "${RUNNER_TEMP}/gdb-commands"
          cat > "${RUNNER_TEMP}/trace-godot.sh" <<EOF
          #!/usr/bin/env bash
          gdb -q -batch -x "${RUNNER_TEMP}/gdb-commands" --args "\$@" || true
          EOF
          chmod +x "${RUNNER_TEMP}/trace-godot.sh"

      - name: Import the project
        run: |
          status=0
          "${GODOT}" --headless --verbose --path game --import || status=$?
          if [[ "${status}" != 0 && -x "${RUNNER_TEMP}/trace-godot.sh" ]]; then
            echo "::warning::The import exited with ${status}; running it again under gdb"
            rm -rf game/.godot
            "${RUNNER_TEMP}/trace-godot.sh" "${GODOT}" --headless --verbose --path game --import
          fi
          exit "${status}"

      - name: Export
        env:
          PRESET: ${{ matrix.preset }}
          OUTPUT: ${{ matrix.output }}
        run: |
          mkdir -p "build/$(dirname "${OUTPUT}")"
          status=0
          "${GODOT}" --headless --verbose --path game --export-release "${PRESET}" "../build/${OUTPUT}" || status=$?
          if [[ "${status}" != 0 && -x "${RUNNER_TEMP}/trace-godot.sh" ]]; then
            echo "::warning::The export exited with ${status}; running it again under gdb"
            "${RUNNER_TEMP}/trace-godot.sh" "${GODOT}" --headless --verbose --path game --export-release "${PRESET}" "../build/${OUTPUT}"
          fi
          [[ "${status}" == 0 ]] || exit "${status}"
          test -f "build/${OUTPUT}"
          ls -la "build/$(dirname "${OUTPUT}")"

      - name: Package
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir -p dist
          case "${RUNNER_OS}" in
            Windows) (cd build/windows && 7z a -tzip "../../dist/${PACKAGE}" .) ;;
            macOS) cp build/macos/Pantheon.zip "dist/${PACKAGE}" ;;
            Linux) tar -czf "dist/${PACKAGE}" -C build/linux . ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ matrix.package }}
          archive: false
          if-no-files-found: error

  release:
    name: Publish the release
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Pantheon-*
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          for package in Pantheon-windows-x86_64.zip Pantheon-macos-universal.zip Pantheon-linux-x86_64.tar.gz; do
            test -f "dist/${package}"
          done
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" \
            --title "PANTHEON ${GITHUB_REF_NAME}" --generate-notes
