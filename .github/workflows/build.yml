# Builds and tests every push to main, and exports the game for Windows, macOS and Linux, each on
# its own system (ADR-075). The exports run when started by hand (Actions > Build > Run workflow)
# or by pushing a version tag (v*), which also publishes them as a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push or pull request update cancels the older one's tests; an export by hand or by a tag
# is never cancelled.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # An exact SDK, not 8.0.x: "the latest 8.0" resolves through aka.ms links, and on 2026-10-25 the
  # macOS one pointed at an unpublished 8.0.427 that could not be downloaded.
  DOTNET_SDK_VERSION: "8.0.426"
  # No MSBuild nodes or compiler server left running after a build: on Windows they keep the
  # console's handles open, and Godot's export then waited 15 minutes for them to time out.
  MSBUILDDISABLENODEREUSE: "1"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  UseSharedCompilation: "false"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Fetch Terrain3D's libraries
        run: tools/vendor-terrain3d.sh

      - name: Build
        run: dotnet build Pantheon.sln

      - name: Test
        run: dotnet test Pantheon.sln --no-build

  export:
    name: Export (${{ matrix.platform }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            preset: Windows Desktop
            output: windows/Pantheon.exe
            package: Pantheon-windows-x86_64.zip
          # The macOS export signs the app with Apple's codesign, which only runs on a Mac.
          - platform: macos
            runner: macos-latest
            preset: macOS
            output: macos/Pantheon.zip
            package: Pantheon-macos-universal.zip
          - platform: linux
            runner: ubuntu-latest
            preset: Linux
            output: linux/Pantheon.x86_64
            package: Pantheon-linux-x86_64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Cache Godot
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ runner.os }}-${{ hashFiles('tools/install-godot.sh') }}

      - name: Install Godot and its export templates
        run: |
          godot="$(tools/install-godot.sh --dest "${RUNNER_TEMP}/godot")"
          echo "GODOT=${godot}" >> "${GITHUB_ENV}"

      - name: Fetch Terrain3D's libraries
        run: tools/vendor-terrain3d.sh

      # Godot 4.7.2 sometimes crashes as it shuts down, after an import or export has finished
      # (SIGSEGV in its cleanup; seen on the Linux and macOS runners, never on the owner's Mac).
      # A run that fails is tried again, up to three times in all.
      - name: Import the project
        run: |
          for attempt in 1 2 3; do
            if "${GODOT}" --headless --path game --import; then exit 0; fi
            echo "::warning::Godot's import failed (attempt ${attempt} of 3)"
          done
          exit 1

      - name: Export
        env:
          PRESET: ${{ matrix.preset }}
          OUTPUT: ${{ matrix.output }}
        run: |
          mkdir -p "build/$(dirname "${OUTPUT}")"
          exported=false
          for attempt in 1 2 3; do
            if "${GODOT}" --headless --path game --export-release "${PRESET}" "../build/${OUTPUT}"; then
              exported=true
              break
            fi
            echo "::warning::Godot's export failed (attempt ${attempt} of 3)"
          done
          [[ "${exported}" == true ]]
          test -f "build/${OUTPUT}"
          ls -la "build/$(dirname "${OUTPUT}")"

      - name: Package
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir -p dist
          case "${RUNNER_OS}" in
            Windows) (cd build/windows && 7z a -tzip "../../dist/${PACKAGE}" .) ;;
            macOS) cp build/macos/Pantheon.zip "dist/${PACKAGE}" ;;
            Linux) tar -czf "dist/${PACKAGE}" -C build/linux . ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ matrix.package }}
          archive: false
          if-no-files-found: error

  release:
    name: Publish the release
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Pantheon-*
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          for package in Pantheon-windows-x86_64.zip Pantheon-macos-universal.zip Pantheon-linux-x86_64.tar.gz; do
            test -f "dist/${package}"
          done
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" \
            --title "PANTHEON ${GITHUB_REF_NAME}" --generate-notes
